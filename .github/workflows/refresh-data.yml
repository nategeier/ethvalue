name: Refresh on-chain data

# Keeps the ethvalue DB series fresh:
#   - tx_volume       (Coin Metrics daily ETH tx count)
#   - validator_queue (validatorqueue.com: real entry/exit queue + wait times)
# Runs daily and on manual dispatch. Scheduled runs fire from the default
# branch only (active once this is merged to main).

on:
  schedule:
    - cron: "13 7 * * *" # 07:13 UTC daily
  workflow_dispatch: {}

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Refresh transaction volume
        run: node scripts/ingest-tx-volume.mjs

      - name: Refresh validator queue
        run: node scripts/ingest-validator-queue.mjs
